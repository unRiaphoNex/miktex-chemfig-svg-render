name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run ESLint
        run: pnpm lint || echo "Lint warnings found, continuing..."
      
      - name: Type check
        run: pnpm typecheck || echo "Type errors found, continuing..."
      
      - name: Build
        run: pnpm build
      
      - name: Test
        run: pnpm test || echo "Tests have issues, continuing..."
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-main-node${{ matrix.node-version }}
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 7
